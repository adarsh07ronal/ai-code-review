name: CD - Build & Push Images

# Runs on every push to master. Assumes branch protection requires the CI
# workflow to pass before a PR can merge. This workflow only builds and
# publishes images to ECR — it does not touch live infrastructure. Rolling
# a new image out to ECS is a separate, manually-triggered step (see
# deploy.yml) so an infra change always has a human in the loop.
on:
  push:
    branches: [master]

permissions:
  id-token: write # required for OIDC -> AWS role assumption, no long-lived keys
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_BACKEND_REPO: ai-code-review-backend
  ECR_FRONTEND_REPO: ai-code-review-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "image_tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build -t "$REGISTRY/$ECR_BACKEND_REPO:$TAG" -t "$REGISTRY/$ECR_BACKEND_REPO:latest" ./backend
          docker push "$REGISTRY/$ECR_BACKEND_REPO:$TAG"
          docker push "$REGISTRY/$ECR_BACKEND_REPO:latest"

      - name: Build & push frontend image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.PUBLIC_API_URL }}" \
            -t "$REGISTRY/$ECR_FRONTEND_REPO:$TAG" -t "$REGISTRY/$ECR_FRONTEND_REPO:latest" ./frontend
          docker push "$REGISTRY/$ECR_FRONTEND_REPO:$TAG"
          docker push "$REGISTRY/$ECR_FRONTEND_REPO:latest"

      - name: Summary
        run: echo "Pushed image tag ${{ steps.tag.outputs.image_tag }} — trigger deploy.yml manually to roll it out." >> "$GITHUB_STEP_SUMMARY"
