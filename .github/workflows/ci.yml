name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt "pydantic[email]"

      - name: Import smoke test
        env:
          SECRET_KEY: ci-dummy-secret-key-not-for-prod
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: python -c "import app.main"

      - name: Compile check
        run: python -m compileall -q app

      - name: Run tests
        if: hashFiles('backend/tests/**') != ''
        env:
          SECRET_KEY: ci-dummy-secret-key-not-for-prod
          DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
        run: pip install pytest pytest-asyncio && pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://ci-placeholder.invalid
        run: npm run build
