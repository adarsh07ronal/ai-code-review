name: Deploy - Terraform Apply

# Deliberately manual (workflow_dispatch only, no push trigger) — rolling
# out infra/image changes to production is a decision a human makes, not
# something that happens automatically on every merge. Pair this with a
# GitHub Environment "production" that has required reviewers configured
# for a second approval gate on top of the manual trigger.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (from the CD workflow's build-and-push job, e.g. the 12-char commit SHA)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init

      - name: Terraform plan
        env:
          TF_VAR_backend_image_tag: ${{ inputs.image_tag }}
          TF_VAR_frontend_image_tag: ${{ inputs.image_tag }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          TF_VAR_app_secret_key: ${{ secrets.APP_SECRET_KEY }}
          TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply tfplan
